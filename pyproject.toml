[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "appointment-app"
version = "0.1.0"
description = "Agentic appointment management on AWS Bedrock + AgentCore (Strands, LangChain, LangGraph, MCP, A2A)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "strands-agents[a2a]>=1.20",
    "bedrock-agentcore>=1.0",
    "mcp>=1.20",
    "langchain>=1.0",
    "langchain-aws>=1.0",
    "langgraph>=1.0",
    "langchain-mcp-adapters>=0.2",
    "a2a-sdk>=0.3",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "boto3>=1.35",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "moto[dynamodb]>=5"]
deploy = ["bedrock-agentcore-starter-toolkit"]

[project.scripts]
appointment-app = "appointment_app.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
