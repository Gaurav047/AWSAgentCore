name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    # Set the RUNNER_LABELS repository variable to a JSON array (e.g. ["self-hosted","awsagentcore"])
    # to run on a self-hosted runner; unset, jobs use GitHub-hosted Ubuntu.
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS || '"ubuntu-latest"') }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    env:
      # Tests are fully offline; a region is set only so boto3 clients can be constructed.
      AWS_DEFAULT_REGION: us-east-1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        if: runner.environment == 'github-hosted'
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      # setup-python's macOS builds only install under /Users/runner (GitHub-hosted machines),
      # so self-hosted runners use a locally installed python3.X (e.g. Homebrew) in a fresh venv.
      - name: Use local Python (self-hosted)
        if: runner.environment == 'self-hosted'
        run: |
          PY=$(command -v python${{ matrix.python-version }} || echo /opt/homebrew/bin/python${{ matrix.python-version }})
          "$PY" -m venv "$RUNNER_TEMP/venv"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest -q
